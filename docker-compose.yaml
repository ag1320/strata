version: "3"
services:
  database:
    image: "postgres:14"
    restart: unless-stopped
    volumes:
      - ./database:/var/lib/postgresql/data
      - ./csv-data:/csv-data
    networks:
      - network1
    container_name: database
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"

  backend:
    networks:
      - network1
    build: ./backend
    ports:
      - "3001:3001"
    container_name: backend
    # Matters specifically because of a first-boot race: on a fresh
    # `database` volume, Postgres's initdb takes a few seconds, and
    # `depends_on:` (bare list form) only waits for the container to start,
    # not for Postgres inside it to be ready - without this, `backend`
    # losing that race on `knex migrate:latest` exits permanently instead
    # of Compose retrying.
    restart: unless-stopped
    depends_on:
      - database
    environment:
      DB_CONNECTION_STRING: ${DB_CONNECTION_STRING}
    env_file: ".env"

  frontend:
    networks:
      - network1
    build: ./frontend
    ports:
      - "3000:3000"
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - backend

networks:
  network1:
    driver: bridge